<style>
@font-face{font-family:"Space Grotesk";src:url(/vendor/fonts/space-grotesk-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/vendor/fonts/space-grotesk-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}

:root{--ink:#150c2e;--sub:#5b5378;--line:#ebe5f6;--soft:#f7f4fd;--pink:#ff4cb0;--plum:#5a2d91;--indigo:#2e2a8f;
--gradx:linear-gradient(90deg,#4d5dd7 5%,#8f55cd 22%,#b152ca 30%,#ff4cb0 45%,#fa6396 61%,#f56b85 68%,#ec825b 85%);
--grad:linear-gradient(135deg,#4d5dd7 0%,#8f55cd 25%,#ff4cb0 55%,#f56b85 75%,#ec825b 100%)}
*{box-sizing:border-box;min-width:0}
html{color-scheme:light}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
.bar{height:6px;background:var(--gradx)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1000px;margin:0 auto;padding:20px 20px 0}
.logo{display:flex;align-items:center;gap:10px;font:700 21px/1 "Space Grotesk",sans-serif;letter-spacing:-.035em;text-decoration:none}
.logo svg{flex:none}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{font:600 13px/1 Inter,sans-serif;color:var(--sub);background:none;border:0;border-radius:999px;padding:9px 13px;min-height:36px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
a:focus-visible,button:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:8px}
main{max-width:1000px;margin:0 auto;padding:30px 20px 48px}
.hero{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:44px;align-items:center}
.pic{position:relative;border-radius:28px;padding:5px;background:var(--grad);box-shadow:0 24px 60px rgba(90,45,145,.22)}
.pic img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:24px;background:#f3eefc}
.pic .mono{display:grid;place-items:center;aspect-ratio:1;border-radius:24px;background:radial-gradient(120% 90% at 80% 10%,rgba(255,255,255,.28),transparent 60%),linear-gradient(160deg,#2e2a8f 0%,#5a2d91 55%,#150c2e 100%);color:#fff;font:700 clamp(96px,16vw,168px)/1 "Space Grotesk",sans-serif;letter-spacing:-.05em}
.pic span{position:absolute;left:18px;bottom:18px;font:600 12px/1 Inter,sans-serif;background:rgba(255,255,255,.92);color:var(--ink);padding:8px 11px;border-radius:999px}
.kick{font:600 14px/1.3 Inter,sans-serif;color:var(--plum);margin:0 0 10px}
h1{font:700 clamp(40px,7vw,64px)/1 "Space Grotesk",sans-serif;letter-spacing:-.035em;margin:0;text-wrap:balance}
.role{font:700 clamp(22px,3.2vw,30px)/1.15 "Space Grotesk",sans-serif;letter-spacing:-.02em;margin:14px 0 0;background:var(--gradx);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.line{font-size:18px;color:var(--sub);margin:16px 0 0;max-width:34ch}
.badge{display:inline-flex;align-items:center;gap:10px;margin:18px 0 0;padding:10px 16px 10px 12px;border-radius:14px;background:#eef1ff;border:1px solid #d9def9;font:600 14px/1.35 Inter,sans-serif;color:#1f2a8a}
.badge i{flex:none;width:10px;height:10px;border-radius:50%;background:#3a4fd6;box-shadow:0 0 0 4px rgba(58,79,214,.15)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0;padding:0;list-style:none}
.tags li{font:600 13px/1 Inter,sans-serif;padding:9px 13px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 0}
.links a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;text-decoration:none;font:600 15px/1 Inter,sans-serif;border:1px solid var(--line);background:#fff}
.links a.main{background:var(--ink);color:#fff;border-color:var(--ink)}
.links a:hover{border-color:var(--plum)}
h2{font:700 28px/1.1 "Space Grotesk",sans-serif;letter-spacing:-.02em;margin:64px 0 20px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:22px;padding:22px 22px 18px;background:#fff;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease}
.card::before{content:"";position:absolute;left:22px;right:22px;top:0;height:4px;border-radius:0 0 4px 4px;background:var(--gradx);opacity:.9}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(46,42,143,.12)}
.card small{font:600 12px/1 Inter,sans-serif;color:var(--plum);text-transform:none;margin:6px 0 10px}
.card h3{font:700 22px/1.15 "Space Grotesk",sans-serif;letter-spacing:-.015em;margin:4px 0 0}
.card p{margin:0;color:var(--sub);font-size:15px;flex:1}
.card em{font-style:normal;font:600 14px/1 Inter,sans-serif;margin-top:16px;color:var(--ink)}
.card em::after{content:" \2192"}
footer{max-width:1000px;margin:0 auto;padding:0 20px 34px;color:#857da1;font-size:12.5px;line-height:1.5}
@media(max-width:860px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.hero{grid-template-columns:1fr;gap:26px}.pic{max-width:340px}.grid{grid-template-columns:1fr}h2{margin-top:48px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>

function put(l){

 document.getElementById('grid').innerHTML=P.map(p=>{const ext=/^https?:/.test(p.u);return '<a class="card" href="'+p.u+'"'+(ext?' rel="noopener"':'')+'><h3>'+esc(p.n)+'</h3><small>'+esc(p.k[l])+'</small><p>'+esc(p.d[l])+'</p><em>'+esc(p.c[l])+'</em></a>'}).join('');
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
