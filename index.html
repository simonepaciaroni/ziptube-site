/* Caratteri e mappa serviti dal nostro spazio: la pagina non contatta altri siti finche' non compaiono anteprime o video di YouTube. */
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:url(vendor/fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-style:normal;font-weight:500;font-display:swap;src:url(vendor/fonts/inter-latin-500-normal.woff2) format('woff2')}

@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:700;font-display:swap;src:url(vendor/fonts/space-grotesk-latin-700-normal.woff2) format('woff2')}
/* Mappa a tutto schermo. Marchio in alto a sinistra. A destra un solo pannello: video, conversazione con i risultati, campo di domanda. */
:root{--bg:#0d1414;--glass:#10223ac7;--solid:#161d1dc7;--line:#ffffff1c;--fg:#f3f1e8;--mute:#bcc8c4;--sun:#f5c59d;--rose:#d77b89;--plum:#76536d;--sea:#2c66a5;--grad:linear-gradient(100deg,#f5c59d,#d77b89 55%,#9a6aa0);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14.5px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,.zip:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
svg{flex:none}
#map{position:absolute;inset:0;background:var(--sea)}
/* Giunture tra le tessere a zoom frazionario: le tessere si sovrappongono di mezzo punto e si dipingono normalmente.
   (Leaflet di suo le somma, e dove si sovrappongono comparirebbe una riga chiara.) */
.leaflet-container img.leaflet-tile{mix-blend-mode:normal;width:256.6px!important;height:256.6px!important}
.leaflet-container{font:inherit;background:var(--sea)}
/* Ai livelli di zoom intermedi le tessere si toccano con un filo di sovrapposizione: niente righine tra una e l'altra. */
.leaflet-control-attribution{background:#0d141480!important;color:var(--mute)!important;font-size:10.5px}
.leaflet-control-attribution a{color:var(--mute)!important}
.leaflet-bar a{background:#10181894!important;backdrop-filter:blur(10px);color:var(--fg)!important;border-color:var(--line)!important}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 16px 44px #0006;text-shadow:0 1px 2px #0008}

/* Marchio: segno e nome in alto a sinistra, senza pannello. L'ombra lo tiene leggibile sopra ogni punto della mappa. */
#brand{position:absolute;z-index:1000;left:18px;top:16px}
.logo{font:700 23px/1 "Space Grotesk",sans-serif;letter-spacing:-.035em;display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;text-shadow:0 1px 3px #0009,0 0 14px #0006}
.logo svg{flex:none;filter:drop-shadow(0 2px 6px #0007)}
.logo:focus-visible{outline:2px solid var(--sun);outline-offset:4px;border-radius:8px}
#live{position:absolute;z-index:1000;left:16px;top:60px;padding:7px 14px 7px 11px;border-radius:40px;display:none;align-items:center;gap:8px;font-size:12.5px}
#lyBtn{position:absolute;z-index:1000;left:10px;bottom:88px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--fg);padding:0}
#lyBtn:hover,#lyBtn[aria-expanded=true]{background:#ffffff26}
#ly{position:absolute;z-index:1001;left:54px;bottom:20px;width:270px;max-width:calc(100% - 70px);border-radius:16px;padding:12px 14px 13px;font-size:12.5px}
#ly h3{margin:0 0 8px;font:700 13.5px "Space Grotesk",sans-serif}
#ly .lgr{display:flex;align-items:center;gap:9px;margin:5px 0;color:#e4e8df}
#ly .lgr em{margin-left:auto;font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums}
#ly .dot{flex:none;width:13px;height:13px;border-radius:50%;box-sizing:border-box}
#ly .dot.z{background:#d77b89;border:2px solid #fff}
#ly .dot.v{width:10px;height:10px;margin:0 1.5px;background:#f5c59d;border:1.5px solid #101818}
#ly .dot.u{width:11px;height:11px;margin:0 1px;background:#101818;border:2px solid #f5c59d}
#ly .sep{height:1px;background:var(--line);margin:10px 0}
#ly .chips{gap:5px}
#ly .chip{font-size:11.5px;padding:3px 9px}
#ly .chip[aria-pressed=true]{background:var(--fg);color:#12191a;border-color:transparent;text-shadow:none}
#ly .hint{margin-top:10px;color:var(--mute)}
#ly .hint .btn{margin-top:7px;padding:5px 11px;font-size:12px}
#live i{width:8px;height:8px;border-radius:50%;background:var(--rose);animation:beat 1.4s infinite}
#live b{font-family:"Space Grotesk",sans-serif}

#side{position:absolute;z-index:1000;right:16px;top:16px;max-height:calc(100% - 32px);width:420px;border-radius:22px;display:flex;flex-direction:column}
#pwrap{display:none;padding:12px 12px 0;flex:none}
#pbox{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
#pbox iframe,#yt{width:100%;height:100%;display:block;border:0}
#zrow{display:flex;align-items:center;gap:10px;padding:10px 4px 0;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
#zbar{position:relative;flex:1;height:8px;border-radius:2px;background:repeating-linear-gradient(90deg,#ffffff2e 0 3px,transparent 3px 6px)}
#zseg{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--sun) 0 3px,transparent 3px 6px)}
#zpull{position:absolute;top:-5px;width:11px;height:18px;margin-left:-5.5px;border-radius:3px 3px 6px 6px;background:radial-gradient(circle at 50% 68%,#101818 0 1.8px,transparent 2.3px),var(--grad);box-shadow:0 2px 6px #0009;transition:left .5s linear}
#zrow b{color:var(--sun);font-weight:600}
#pmeta{display:flex;align-items:center;gap:8px;padding:8px 4px 2px;font-size:12px;color:var(--mute)}
#lline{flex:1;min-width:0}
#lline.warn{color:var(--rose)}
#fbq{white-space:nowrap}
.vote{border:1px solid var(--line);background:none;border-radius:40px;padding:2px 11px;font-size:12px;color:var(--mute)}
.vote[aria-pressed=true]{border-color:var(--sun);color:var(--sun);font-weight:600}
.vote.no[aria-pressed=true]{border-color:var(--rose);color:var(--rose)}

#feed{flex:0 1 auto;min-height:0;overflow:auto;border-radius:22px 22px 0 0;padding:14px 14px 8px;display:flex;flex-direction:column;gap:10px}
#welcome .eyebrow{font:600 10.5px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--sun);margin:2px 2px 0}
#welcome h2{font:700 20px/1.2 "Space Grotesk",sans-serif;letter-spacing:-.02em;margin:4px 2px 4px;text-wrap:balance}
#welcome p{margin:0 2px 12px;color:var(--mute);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#ffffff0d;border-radius:40px;padding:5px 12px;font-size:13px;text-align:left}
.chip:hover{border-color:#ffffff59;background:#ffffff17}
#welcome .hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cd{font:600 10.5px Inter,sans-serif;color:#1b1416;background:var(--grad);border-radius:40px;padding:3px 9px;white-space:nowrap;text-shadow:none}
.sub{font:600 10.5px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:15px 2px 7px}
.chips.sm .chip{font-size:12px;padding:3px 10px;color:#e4e8df}
.stats{margin:14px 2px 2px;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg);font-weight:600}
.ofc{flex:none;align-self:center;font:600 9.5px Inter,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:#1b1416;background:var(--sun);border-radius:4px;padding:1px 5px;text-shadow:none}
#sg{position:absolute;z-index:6;left:0;right:0;bottom:calc(100% + 8px);background:#131c26f5;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:0 20px 50px #000b}
#sg.down{bottom:auto;top:calc(100% + 8px)}
.sgo{display:flex;align-items:baseline;gap:10px;width:100%;border:0;background:none;color:inherit;text-align:left;padding:7px 10px;border-radius:9px;font-size:13.5px;cursor:pointer}
.sgo small{flex:none;width:68px;font:600 9.5px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--sun)}
.sgo span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sgo em{font-style:normal;color:var(--mute);font-size:11.5px;margin-left:auto;flex:none}
.sgo.act,.sgo:hover{background:#ffffff17}
#upnext{position:relative;display:flex;align-items:center;gap:8px;margin-top:8px;padding:7px 8px 7px 12px;border-radius:12px;background:#00000047;border:1px solid var(--line);overflow:hidden;font-size:12.5px}
#upnext[hidden]{display:none}
#upnext .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:#f5c59d24;transition:width 1s linear}
#upnext .txt{position:relative;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#upnext .txt small{display:block;font:600 10px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--sun)}
#upnext .btn{position:relative;flex:none;padding:5px 11px;font-size:12px}
.mu{align-self:flex-end;background:#ffffff17;border-radius:15px 15px 4px 15px;padding:6px 12px;max-width:85%;font-size:14px}
.ma{display:flex;gap:8px;font-size:13.5px;color:#d9ddd3}
.ma i{width:12px;height:17px;border-radius:3px 3px 6px 6px;background:radial-gradient(circle at 50% 66%,#101818 0 1.6px,transparent 2.1px),var(--grad);flex:none;margin:2px 2px 0}
.ma .chips{margin-top:8px}
.res{display:flex;flex-direction:column;gap:6px}
.zip{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;border:1px solid transparent;border-radius:12px;padding:5px;cursor:pointer;transition:background .15s,border-color .15s}
.zip:hover{background:#ffffff0d}
.res .zip{animation:zin .32s both}
.res .zip:nth-child(2){animation-delay:.04s}.res .zip:nth-child(3){animation-delay:.08s}.res .zip:nth-child(4){animation-delay:.12s}.res .zip:nth-child(n+5){animation-delay:.16s}
@keyframes zin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.zip.on{border-color:#f5c59d80;background:#f5c59d14}
.th{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000}
.th img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .2s}
.th span{position:absolute;left:4px;bottom:4px;background:var(--grad);color:#1b1416;font:600 10.5px Inter;padding:0 6px 0 4px;border-radius:5px 5px 5px 9px;font-variant-numeric:tabular-nums}
.th span::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:#1b1416;margin-right:4px;vertical-align:1px}
.zip{position:relative}
.zip.on::before{content:'';position:absolute;left:-1px;top:9px;bottom:9px;width:4px;border-radius:2px;background:repeating-linear-gradient(180deg,var(--sun) 0 3px,transparent 3px 6px)}
.l1{display:flex;gap:6px;align-items:baseline;min-width:0}
.who{font-weight:600;white-space:nowrap}
.what{color:var(--sun);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{color:var(--sun)}
.tag.n{color:var(--mute)}
.tag.my{color:var(--sun)}
.tag.my.no{color:var(--rose)}
.shield .th img{filter:blur(12px) saturate(.5)}

.composer{position:relative;flex:none;display:flex;align-items:center;gap:6px;margin:4px 12px 0;background:#00000059;border:1px solid var(--line);border-radius:16px;padding:5px}
.composer:focus-within{border-color:#ffffff47}
#q{flex:1;min-width:0;border:0;background:none;outline:0;padding:7px 4px;font-size:14.5px}
#q::placeholder{color:#8b9a96}
.ib{width:34px;height:34px;border-radius:50%;border:0;display:grid;place-items:center;background:#ffffff14;color:var(--fg)}
.ib:hover{background:#ffffff26}
#send{background:var(--grad);color:#1b1416}
#send:disabled{opacity:.35;cursor:default}
#menu{display:none;position:absolute;z-index:5;left:0;bottom:calc(100% + 8px);width:min(320px,100%);background:var(--solid);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 20px 50px #000b}
#menu.down{bottom:auto;top:calc(100% + 8px)}
.mrow{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 11px;font-size:14px}
.mrow span{flex:1}
.seg{display:flex;gap:2px;background:#ffffff12;border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:3px 11px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:#ffffff2e;color:var(--fg)}
.mi b{display:block;font-weight:500}
.mi small{display:block;color:var(--mute);font-size:12px;line-height:1.35}
.sw{width:34px;height:20px;border-radius:20px;background:#ffffff26;position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.mi[aria-checked=true] .sw{background:var(--grad)}
.mi[aria-checked=true] .sw::after{left:16px}
.mi[aria-disabled=true]{opacity:.4;cursor:default}
#menu.open{display:block}
.mi{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:10px;padding:9px 11px;text-align:left;font-size:14px}
.mi:hover,.mi:focus-visible{background:#ffffff12;outline:0}
.mi span{flex:1}
.mi em{font-style:normal;color:var(--mute);font-size:12.5px}
.mi .ck{color:#7aa7ff;visibility:hidden}
.mi[aria-checked=true] .ck{visibility:visible}
.sep{height:1px;background:var(--line);margin:5px 8px}
.ptip{background:#101818e6;color:#f3f1e8;border:1px solid #ffffff2e;border-radius:8px;font:500 12px Inter,sans-serif;box-shadow:0 4px 14px #0008}
.ptip::before{display:none}
.ptip small{display:block;color:var(--sun);font-size:11px;margin-top:2px}
.ptip small .ni{pointer-events:none;margin:0 4px 0 0;width:13px;height:13px;font-size:9px}
/* (i): informazione non verificata. Al passaggio del mouse, al tocco o da tastiera apre la piccola finestra #nitip. */
.ni{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:5px;border-radius:50%;border:1px solid currentColor;font:italic 700 10px/1 Georgia,'Times New Roman',serif;opacity:.8;cursor:help;vertical-align:1px;pointer-events:auto;-webkit-user-select:none;user-select:none;flex:none;transition:background .15s,opacity .15s}
.ni:hover,.ni:focus-visible,.ni.on{opacity:1;background:var(--sun);border-color:var(--sun);color:#12191a;outline:0}
#nitip{position:fixed;z-index:4000;left:0;top:0;padding:5px 10px;border-radius:9px;background:#101818f2;border:1px solid #ffffff2e;color:var(--fg);font:500 12px Inter,sans-serif;white-space:nowrap;box-shadow:0 6px 18px #0009;pointer-events:none}
#nitip[hidden]{display:none}
.md{font-size:12.5px;color:var(--mute);margin-top:4px}
.foot{flex:none;font-size:11px;color:#bcc8c4;padding:6px 18px 9px;text-align:center}
.foot summary{cursor:pointer;list-style:none;display:inline-block;padding:2px 8px;border-radius:8px}
.foot summary::-webkit-details-marker{display:none}
.foot summary:hover{color:var(--fg)}
.foot summary:focus{outline:0}
.foot summary:focus-visible{outline:2px solid var(--sun)}
.foot summary::after{content:" \25BE"}
.foot details[open] summary::after{content:" \25B4"}
/* Le due note espandibili stanno sulla stessa riga; quella aperta prende tutta la larghezza. */
.foot .links{display:flex;flex-wrap:wrap;justify-content:center;gap:0 6px}
.foot details[open]{flex-basis:100%}
.foot .by{font-size:10.5px;letter-spacing:.04em;color:#9fb0aa;margin-bottom:2px}
.foot p{margin:4px 0 2px;line-height:1.45;text-align:left}

.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:40px;background:#0d141966;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);font:600 13px Inter,sans-serif;white-space:nowrap;cursor:pointer;box-shadow:0 4px 14px #0008;transition:transform .2s,background .2s,opacity .25s}
.pin i{width:21px;height:21px;border-radius:50%;background:var(--plum);font:600 11px/21px Inter;font-style:normal;text-align:center}
.pin:hover{transform:translate(-50%,-50%) scale(1.08)}
.pin.mini{padding:5px 6px;gap:0}
.pin.mini span{display:none}
.pin.dim{opacity:.35}
.pin.sel{background:var(--fg);color:#12191a}
.pin.sel i{background:#12191a;color:var(--fg)}
.pin.live{opacity:1;background:var(--grad);color:#1b1416;border-color:transparent;animation:glow 1.4s infinite}
.pin.live i{background:#1b1416;color:var(--sun)}
@keyframes beat{0%{box-shadow:0 0 0 0 #d77b89}70%{box-shadow:0 0 0 9px #d77b8900}100%{box-shadow:0 0 0 0 #d77b8900}}
@keyframes glow{0%{box-shadow:0 0 0 0 #f5c59dcc}70%{box-shadow:0 0 0 16px #f5c59d00}100%{box-shadow:0 0 0 0 #f5c59d00}}

/* Video aperto: lo schermo si divide a meta', mappa a sinistra e video a destra */
body.playing #side{left:calc(50% + 8px);right:16px;width:auto;bottom:16px;max-height:none}
body.playing #pwrap{padding:14px 14px 0}
body.playing #feed{flex:1 1 auto}
#pwrap{position:relative}
#close{position:absolute;top:22px;right:22px;z-index:2;width:30px;height:30px;border-radius:50%;border:0;background:#000000a6;color:#fff;display:grid;place-items:center}
#close:hover{background:#000000d9}
@media (max-width:820px){
 body.playing #map{right:0}
 body.playing #side{left:8px;right:8px;top:auto;bottom:8px;max-height:62vh}
 /* Finestre strette ma larghe piu' di un telefono: il video non deve mangiarsi l'elenco e la barra di ricerca. */
 #pbox{max-width:calc(32vh * 16 / 9);margin:0 auto}
 #close{top:18px;right:18px}
}
@media (max-width:820px){
 #brand{left:12px;top:12px}.logo{font-size:20px}.logo svg{width:25px;height:25px}
 #live{left:8px;top:50px}
 #side{left:8px;right:8px;bottom:8px;top:auto;width:auto;max-height:58vh;border-radius:18px}
 .leaflet-control-zoom,.leaflet-control-attribution{display:none}
 #lyBtn{left:auto;bottom:auto;right:10px;top:12px}
 #ly{left:auto;bottom:auto;right:10px;top:54px;max-height:46vh;overflow:auto}
 /* Su telefono, mentre un video e' aperto, lo spazio va al video e agli zip: note e crediti tornano alla chiusura. */
 body.playing .foot{display:none}

 #welcome .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}

 .sub{margin-top:11px}.stats{margin-top:10px}
 #pmeta{flex-wrap:wrap;gap:6px 8px}
 #lline{flex:1 1 100%}

/* Pulsanti e finestre di consenso e testi legali */
.btn{border:1px solid var(--line);background:#ffffff14;color:var(--fg);border-radius:40px;padding:8px 16px;font:600 13px Inter,sans-serif;text-shadow:none}
.btn:hover{background:#ffffff26}
.btn.pri{background:var(--grad);border-color:transparent;color:#1b1416}
.btn.pri:hover{filter:brightness(1.07);background:var(--grad)}
.lnk{background:none;border:0;padding:2px 8px;border-radius:8px;color:inherit;font:inherit;cursor:pointer}
.lnk:hover{color:var(--fg)}
.lnk:focus-visible,.btn:focus-visible,.xb:focus-visible,.swb:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.xb{width:30px;height:30px;border-radius:50%;border:0;background:#ffffff14;color:var(--fg);display:grid;place-items:center;flex:none}
.xb:hover{background:#ffffff2b}
#consent{position:fixed;z-index:3000;left:16px;bottom:16px;width:min(410px,calc(100vw - 32px));border-radius:20px;padding:18px 18px 12px;background:#101818e6}
#consent[hidden],#legal[hidden]{display:none}
#consent h2{font:700 17px/1.2 "Space Grotesk",sans-serif;margin:0 36px 6px 0}
#consent p{margin:0 0 13px;font-size:13px;line-height:1.5;color:#d9ddd3}
#consent .xb{position:absolute;top:12px;right:12px}
#consent .lnk{color:var(--mute);font-size:12px;text-decoration:underline;text-underline-offset:2px;padding:2px 0}
.crow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:9px}
#legal{position:fixed;inset:0;z-index:3500;background:#000000a6;display:grid;place-items:center;padding:16px}
.lbox{width:min(760px,100%);max-height:min(88vh,920px);display:flex;flex-direction:column;border-radius:22px;background:#111919f7;border:1px solid var(--line);box-shadow:0 30px 80px #000a}
.lhead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.lhead .seg{flex-wrap:wrap}
.lhead .xb{margin-left:auto}
#lgBody{overflow:auto;padding:4px 26px 26px;font-size:14px;line-height:1.6;color:#dfe3da;outline:0}
#lgBody h2{font:700 22px/1.2 "Space Grotesk",sans-serif;margin:20px 0 6px;color:var(--fg)}
#lgBody h3{font:700 15px/1.3 "Space Grotesk",sans-serif;margin:20px 0 4px;color:var(--fg)}
#lgBody p{margin:6px 0}
#lgBody ul{margin:6px 0;padding-left:20px}
#lgBody li{margin:3px 0}
#lgBody a{color:var(--sun)}
#lgBody table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
#lgBody th,#lgBody td{text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
#lgBody th{color:var(--mute);font-weight:600}
#lgBody .draft{border:1px solid var(--rose);color:#ffc9d1;border-radius:10px;padding:8px 12px;margin-top:16px;font-size:13px}
#lgBody .upd{color:var(--mute);font-size:12.5px;margin-top:22px}
.prefs{border:1px solid var(--line);border-radius:14px;padding:8px 14px 12px;margin:14px 0 4px;background:#ffffff0a}
.prow{display:flex;align-items:center;gap:12px;padding:7px 0}
.prow>span{flex:1;min-width:0}
.prow b{display:block;color:var(--fg);font-weight:600}
.prow small{display:block;color:var(--mute);font-size:12.5px;line-height:1.4}
.swb{border:0;background:none;padding:2px;border-radius:20px}
.swb .sw{display:block}
.swb[disabled]{opacity:.55}
.swb[aria-checked=true] .sw{background:var(--grad)}
.swb[aria-checked=true] .sw::after{left:16px}
.pcode{font:12px ui-monospace,Menlo,monospace;color:var(--mute);word-break:break-all}
.pmsg{color:var(--sun);font-size:12.5px}
/* Senza consenso a YouTube: niente anteprime, e al posto del video la richiesta con il link diretto. */
.th.noimg{background:linear-gradient(135deg,#f5c59d3d,#9a6aa066),#141c1c}
.ytask{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px;height:100%;padding:18px;font-size:13px;color:#d9ddd3;background:linear-gradient(135deg,#f5c59d14,#9a6aa024),#0c1212}
.ytask a{color:var(--sun);font-size:12.5px}
@media (max-width:820px){
 #consent{left:8px;right:8px;bottom:8px;width:auto}
 #legal{padding:0}
 .lbox{width:100%;height:100%;max-height:none;border-radius:0}
 #lgBody{padding:4px 18px 26px}
}
